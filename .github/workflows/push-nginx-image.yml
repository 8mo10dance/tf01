name: Push nginx image to ECR

on:
  pull_request:
    branches:
      - issue/13-nginx-ci
    paths:
      - client/**
      - Dockerfile
      - .dockerignore
      - nginx/**
      - .github/workflows/push-nginx-image.yml
  push:
    branches:
      - main
    paths:
      - client/**
      - Dockerfile
      - .dockerignore
      - nginx/**
      - .github/workflows/push-nginx-image.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          build-args: BUILD_ENV=production
          push: false
          provenance: false

  push:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ap-northeast-1
      ECR_REPOSITORY: tf01-nginx
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::949926374137:role/tf01-github-actions-ecr-push
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: "949926374137"
          role-session-name: github-actions-${{ github.run_id }}

      - name: Log in to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          build-args: BUILD_ENV=production
          push: true
          provenance: false
          tags: ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}

      - name: Write image details to job summary
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE_URI: ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}
        run: |
          {
            echo "## ECR image"
            echo
            echo "- Tag: \`${IMAGE_URI}:${GITHUB_SHA}\`"
            echo "- Digest: \`${DIGEST}\`"
            echo "- Terraform image URI: \`${IMAGE_URI}@${DIGEST}\`"
          } >> "$GITHUB_STEP_SUMMARY"
