name: Push nginx image to ECR

on:
  pull_request:
    branches:
      - issue/13-nginx-ci
    paths:
      - client/**
      - Dockerfile
      - .dockerignore
      - nginx/**
      - .github/workflows/push-nginx-image.yml
  push:
    branches:
      - main
    paths:
      - client/**
      - Dockerfile
      - .dockerignore
      - nginx/**
      - .github/workflows/push-nginx-image.yml
  workflow_dispatch:

concurrency:
  group: push-nginx-${{ github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          build-args: BUILD_ENV=production
          push: false
          provenance: false

  push:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ap-northeast-1
      ECR_REPOSITORY: tf01-nginx
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::949926374137:role/tf01-github-actions-ecr-push
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: "949926374137"
          role-session-name: github-actions-${{ github.run_id }}

      - name: Log in to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Check whether image tag already exists
        id: image
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          IMAGE_COUNT=$(aws ecr list-images \
            --repository-name "$ECR_REPOSITORY" \
            --filter tagStatus=TAGGED \
            --query "length(imageIds[?imageTag=='${IMAGE_TAG}'])" \
            --output text)

          if [ "$IMAGE_COUNT" -gt 0 ]; then
            DIGEST=$(aws ecr describe-images \
              --repository-name "$ECR_REPOSITORY" \
              --image-ids "imageTag=${IMAGE_TAG}" \
              --query 'imageDetails[0].imageDigest' \
              --output text)
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        if: steps.image.outputs.exists != 'true'
        uses: docker/setup-buildx-action@v4

      - name: Build and push image
        if: steps.image.outputs.exists != 'true'
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          build-args: BUILD_ENV=production
          push: true
          provenance: false
          tags: ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}

      - name: Write image details to job summary
        env:
          DIGEST: ${{ steps.build.outputs.digest || steps.image.outputs.digest }}
          IMAGE_URI: ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}
          IMAGE_EXISTS: ${{ steps.image.outputs.exists }}
        run: |
          {
            echo "## ECR image"
            echo
            echo "- Tag: \`${IMAGE_URI}:${GITHUB_SHA}\`"
            echo "- Digest: \`${DIGEST}\`"
            echo "- Already existed: \`${IMAGE_EXISTS}\`"
            echo "- Terraform image URI: \`${IMAGE_URI}@${DIGEST}\`"
          } >> "$GITHUB_STEP_SUMMARY"
